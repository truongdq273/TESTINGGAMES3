<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bắn Gà Vũ Trụ - Gameplay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b081e;
      color: #ffffff;
    }

    #star-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      padding: 12px 16px;
    }

    /* Top HUD */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 16, 56, 0.85);
      backdrop-filter: blur(8px);
      border: 2px solid #3c3185;
      border-radius: 14px;
      padding: 8px 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .q-badge {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      color: #ffd166;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-badge .dot {
      width: 10px;
      height: 10px;
      background: #06d6a0;
      border-radius: 50%;
      box-shadow: 0 0 10px #06d6a0;
    }

    .score-badge {
      font-weight: 800;
      font-size: 18px;
      color: #4cc9f0;
      background: rgba(76, 201, 240, 0.15);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(76, 201, 240, 0.4);
    }

    .sound-btn {
      background: #2b216d;
      border: 1px solid #5a4abf;
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .sound-btn:hover {
      background: #3f3299;
      transform: scale(1.08);
    }

    /* Question Box */
    .question-card {
      margin: 10px auto 0;
      max-width: 820px;
      width: 100%;
      background: linear-gradient(135deg, rgba(30, 22, 77, 0.92), rgba(46, 33, 110, 0.92));
      border: 2px solid #5e4bbd;
      border-radius: 16px;
      padding: 14px 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(94, 75, 189, 0.3);
      position: relative;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Target Chicken Fleet Area */
    .chickens-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-gap: 14px;
      max-width: 860px;
      width: 100%;
      margin: 12px auto;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .chickens-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-gap: 16px;
      }
    }

    .chicken-pod {
      position: relative;
      background: rgba(27, 20, 68, 0.85);
      border: 2px solid #443596;
      border-radius: 18px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s, box-shadow 0.2s;
      min-height: 160px;
      justify-content: space-between;
    }

    .chicken-pod:hover, .chicken-pod:focus-visible {
      transform: translateY(-6px) scale(1.02);
      border-color: #ffd166;
      box-shadow: 0 0 25px rgba(255, 209, 102, 0.45);
      outline: none;
    }

    .chicken-pod.selected {
      border-color: #4cc9f0;
      box-shadow: 0 0 30px #4cc9f0;
    }

    .chicken-pod.hit-correct {
      animation: explodeAnim 0.8s forwards;
    }

    .chicken-pod.hit-wrong {
      animation: wobbleAnim 0.6s forwards;
      border-color: #ef476f;
    }

    .chicken-pod.disabled {
      pointer-events: none;
      opacity: 0.7;
    }

    .chicken-avatar-wrapper {
      position: relative;
      width: 80px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chicken-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
      transition: transform 0.2s;
    }

    .chicken-pod:hover .chicken-img {
      transform: rotate(-4deg) scale(1.05);
    }

    .puff-img {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 100px;
      height: 95px;
      object-fit: contain;
      display: none;
      z-index: 10;
    }

    .drumstick-img {
      position: absolute;
      width: 44px;
      height: 44px;
      display: none;
      z-index: 12;
      animation: dropDrumstick 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .option-key-badge {
      position: absolute;
      top: 6px;
      left: 8px;
      background: #7209b7;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.3);
    }

    .option-text {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.35;
      color: #e2e8f0;
      word-break: break-word;
    }

    /* Bottom Cockpit / Spaceship Area */
    .bottom-hangar {
      position: relative;
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .spaceship-wrapper {
      position: relative;
      width: 70px;
      height: 100px;
      cursor: crosshair;
      transition: transform 0.15s ease-out;
    }

    .spaceship-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(76, 201, 240, 0.5));
    }

    .thruster-glow {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #ffd166 0%, #ff5400 60%, transparent 80%);
      border-radius: 50%;
      animation: flamePulse 0.15s infinite alternate;
      filter: blur(1px);
    }

    /* Laser Bolt Animation */
    .laser-bolt {
      position: absolute;
      width: 5px;
      height: 35px;
      background: #4cc9f0;
      border-radius: 3px;
      box-shadow: 0 0 12px #4cc9f0, 0 0 20px #06d6a0;
      z-index: 99;
      pointer-events: none;
      transform-origin: center bottom;
    }

    /* Feedback Banner Modal */
    .feedback-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 6, 25, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .feedback-box {
      background: linear-gradient(135deg, #1b1544, #261d5f);
      border: 3px solid #5a4abf;
      border-radius: 20px;
      max-width: 540px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .feedback-box.correct {
      border-color: #06d6a0;
      box-shadow: 0 0 35px rgba(6, 214, 160, 0.4);
    }

    .feedback-box.wrong {
      border-color: #ef476f;
      box-shadow: 0 0 35px rgba(239, 71, 111, 0.4);
    }

    .feedback-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .feedback-title.correct { color: #06d6a0; }
    .feedback-title.wrong { color: #ffd166; }

    .feedback-explanation {
      font-size: 15px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid #4cc9f0;
      text-align: left;
    }

    .next-q-btn {
      background: linear-gradient(135deg, #7209b7, #4361ee);
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.5);
      transition: all 0.2s;
    }

    .next-q-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 22px rgba(67, 97, 238, 0.7);
    }

    /* Mission Complete Screen */
    .mission-complete-card {
      text-align: center;
      max-width: 500px;
      margin: auto;
      background: rgba(26, 18, 66, 0.95);
      border: 3px solid #ffd166;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 0 50px rgba(255, 209, 102, 0.3);
      display: none;
      z-index: 10;
    }

    .mission-title {
      font-size: 26px;
      font-weight: 800;
      color: #ffd166;
      margin-bottom: 12px;
    }

    /* Keyframes */
    @keyframes flamePulse {
      0% { transform: translateX(-50%) scale(0.85); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1.25); opacity: 1; }
    }

    @keyframes explodeAnim {
      0% { transform: scale(1); }
      40% { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(0); opacity: 0; }
    }

    @keyframes wobbleAnim {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px) rotate(-6deg); }
      40% { transform: translateX(10px) rotate(5deg); }
      60% { transform: translateX(-8px) rotate(-3deg); }
      80% { transform: translateX(5px) rotate(2deg); }
    }

    @keyframes dropDrumstick {
      0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
      20% { opacity: 1; transform: translateY(20px) scale(1.2) rotate(40deg); }
      100% { transform: translateY(220px) scale(0.9) rotate(360deg); opacity: 0; }
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="star-canvas"></canvas>

  <div id="game-container">
    <!-- Top HUD -->
    <div class="top-bar">
      <div class="q-badge">
        <span class="dot"></span>
        <span id="question-counter">CÂU 1 / 10</span>
      </div>
      <div class="score-badge" id="hud-score">0 ĐIỂM</div>
      <button class="sound-btn" id="toggle-audio-btn" title="Bật/Tắt âm thanh">🔊</button>
    </div>

    <!-- Question Card -->
    <div class="question-card" id="question-card">
      <div class="question-text" id="question-prompt">Đang chuẩn bị phi đội gà vũ trụ...</div>
    </div>

    <!-- 4 Space Chickens -->
    <div class="chickens-grid" id="chickens-grid"></div>

    <!-- Bottom Spaceship -->
    <div class="bottom-hangar">
      <div class="spaceship-wrapper" id="player-spaceship">
        <img src="./assets/spaceship.png" alt="Spaceship" class="spaceship-img">
        <div class="thruster-glow"></div>
      </div>
    </div>
  </div>

  <!-- Educational Feedback Banner Modal -->
  <div class="feedback-overlay" id="feedback-overlay">
    <div class="feedback-box" id="feedback-box">
      <div class="feedback-title" id="feedback-title">CHÍNH XÁC!</div>
      <div class="feedback-explanation" id="feedback-explanation">Giải thích câu hỏi...</div>
      <button class="next-q-btn" id="next-q-btn">CÂU TIẾP THEO ➜ (<span id="auto-next-timer">4</span>s)</button>
    </div>
  </div>

  <!-- Mission Complete Card -->
  <div class="mission-complete-card" id="mission-complete-card">
    <div style="font-size: 54px; margin-bottom: 12px;">🎉 🚀 🍗</div>
    <div class="mission-title">NHIỆM VỤ HOÀN THÀNH!</div>
    <p style="font-size: 16px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.5;">
      Bạn đã hoàn thành xuất sắc toàn bộ 10 câu hỏi bắn gà vũ trụ!
    </p>
    <div style="font-size: 22px; font-weight: 800; color: #4cc9f0; margin-bottom: 14px;" id="final-mission-score">
      Tổng điểm: 100
    </div>
    <p style="font-size: 14px; color: #94a3b8;">
      Đang chờ các bạn khác trong lớp hoàn thành để xem bảng vàng chỉ huy...
    </p>
  </div>

  <!-- SDK and Game Logic -->
  <script src="./sdk.js"></script>
  <script src="./game.js"></script>
</body>
</html>
