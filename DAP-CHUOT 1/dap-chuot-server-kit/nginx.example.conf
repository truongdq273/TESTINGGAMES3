# Adapt upstream/TLS/SSO to Edupia. This is not a complete production server.
# In the http {} context:
map $http_upgrade $classroom_connection { default upgrade; '' close; }
# In the HTTPS server {} serving only dap-chuot-production:
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
autoindex off;
location = /classroom/v1/socket {
    proxy_pass http://classroom_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $classroom_connection;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 90s;
}
# Source/admin/answer files must never be served from this web root.
location ~* /(admin\.html|content\.json|serve\.py|authority-core\.js|room-controller\.js|transport\.js)$ { return 404; }
